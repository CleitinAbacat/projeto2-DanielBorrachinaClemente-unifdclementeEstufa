# Mosquitto: broker local do IoT Agent + ponte com o broker público da HiveMQ

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------------------------------------------------------------------------
# Broker local (sem autenticação)
# ---------------------------------------------------------------------------
listener 1883
allow_anonymous true

# ---------------------------------------------------------------------------
# Ponte com o broker público
# ---------------------------------------------------------------------------
connection hivemq

address broker.hivemq.com:1883

remote_clientid ponte_unifdclementeEstufa

cleansession true

# Exigidas pelo broker público da HiveMQ
try_private false
notifications false
bridge_protocol_version mqttv311

# Tópicos da ponte: in = público -> local, out = local -> público
topic /json/unifdclementeEstufa/estufa001/attrs in 0
topic /json/unifdclementeEstufa/estufa001/cmdexe in 0
topic /unifdclementeEstufa/estufa001/cmd out 0
